<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrusselsExplorer - Foto's</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }
        header {
            background: #1e3c72;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 24px;
        }
        header p {
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.8;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .knoppen {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .fotos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .foto-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .foto-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .foto-info {
            padding: 12px;
        }
        .foto-info h3 {
            font-size: 15px;
            margin-bottom: 8px;
            color: #1e3c72;
        }
        .foto-info p {
            font-size: 12px;
            color: #666;
            margin: 4px 0;
        }
        footer {
            text-align: center;
            padding: 15px;
            background: #1e3c72;
            color: white;
            margin-top: 30px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <h1>BrusselsExplorer - Foto's</h1>
    <p>Alle stripmuren met afbeeldingen van de API</p>
</header>

<div class="container">
    <div class="knoppen">
        <button onclick="location.href='index.html'">Terug naar kaart</button>
    </div>

    <div id="fotosGrid" class="fotos-grid"></div>
</div>

<footer>
    <p>Data en foto's van OpenData Brussels - Parcours BD (Stripmuren)</p>
</footer>

<script>
    async function haalFotos() {
        let url = 'https://opendata.brussels.be/api/explore/v2.1/catalog/datasets/bruxelles_parcours_bd/records?limit=20';
        let response = await fetch(url);
        let data = await response.json();
        
        let grid = document.getElementById('fotosGrid');
        let html = '';
        
        for (let i = 0; i < data.results.length; i++) {
            let item = data.results[i];
            let naam = item.naam_fresco_nl || item.nom_de_la_fresque || 'Onbekend';
            let adres = item.adres_nl || item.adresse_fr || 'Onbekend';
            let tekenaar = item.dessinateur || 'Onbekend';
            let jaar = item.date || 'Onbekend';
            let fotoUrl = item.image ? item.image.url : '';
            
            html += '<div class="foto-card">';
            if (fotoUrl) {
                html += '<img src="' + fotoUrl + '" alt="' + naam + '">';
            } else {
                html += '<div style="height:200px;background:#1e3c72;display:flex;align-items:center;justify-content:center;color:white;">Geen foto</div>';
            }
            html += '<div class="foto-info">';
            html += '<h3>' + naam + '</h3>';
            html += '<p><strong>Adres:</strong> ' + adres + '</p>';
            html += '<p><strong>Tekenaar:</strong> ' + tekenaar + '</p>';
            html += '<p><strong>Jaar:</strong> ' + jaar + '</p>';
            html += '</div>';
            html += '</div>';
        }
        
        grid.innerHTML = html;
    }
    
    haalFotos();
</script>

</body>
</html>
