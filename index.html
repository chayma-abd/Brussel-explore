<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BrusselsExplorer - Ontdek Brussel</title>
    
    <!-- CSS bestand -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Font Awesome voor iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet voor de kaart (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <!-- Header met navigatie -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-map-marker-alt"></i>
                <h1>BrusselsExplorer</h1>
            </div>
            <div class="nav-controls">
                <button id="viewToggle" class="view-toggle-btn">
                    <i class="fas fa-table"></i> Lijstweergave
                </button>
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <!-- ZOEK- EN FILTER SECTIE -->
        <section class="controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Zoek locaties (min. 2 tekens)...">
                <small id="searchValidation" class="validation-message"></small>
            </div>
            
            <div class="filters">
                <select id="categoryFilter">
                    <option value="all">Alle categorieën</option>
                    <option value="culture">🏛️ Cultuur & Musea</option>
                    <option value="nature">🌳 Natuur & Parken</option>
                    <option value="history">🏰 Historisch</option>
                    <option value="art">🎨 Kunst</option>
                </select>
                
                <select id="sortSelect">
                    <option value="name">Sorteer op naam (A-Z)</option>
                    <option value="name-desc">Sorteer op naam (Z-A)</option>
                    <option value="type">Sorteer op type</option>
                </select>
            </div>
            
            <div class="action-buttons">
                <button id="loadDataBtn" class="btn-primary">
                    <i class="fas fa-sync-alt"></i> Laad locaties
                </button>
                <button id="showFavoritesBtn" class="btn-secondary">
                    <i class="fas fa-heart"></i> Favorieten
                </button>
            </div>
        </section>

        <!-- FOUTMELDING CONTAINER -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <!-- LOADING INDICATOR -->
        <div id="loadingIndicator" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Bezig met laden van data...
        </div>

        <!-- STATISTIEKEN -->
        <div class="stats">
            <p id="resultCount">0 locaties gevonden</p>
            <div class="view-stats">
                <span id="currentViewBadge" class="badge">📍 Kaartweergave</span>
                <button id="resetFiltersBtn" class="btn-outline">
                    <i class="fas fa-undo-alt"></i> Reset filters
                </button>
            </div>
        </div>

        <!-- DATA WEERGAVE - TABELWEERGAVE (6 kolommen) -->
        <div id="tableView" class="table-container" style="display: none;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Naam</th>
                        <th>Categorie</th>
                        <th>Type</th>
                        <th>Adres</th>
                        <th>Acties</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="text-center">Geen data geladen. Klik op "Laad locaties".</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- DATA WEERGAVE - KAARTWEERGAVE -->
        <div id="mapView" class="map-container">
            <div id="map" class="leaflet-map"></div>
        </div>

        <!-- DATA WEERGAVE - GRIDWEERGAVE (voor als de kaart niet laadt) -->
        <div id="locationsGrid" class="locations-grid"></div>
    </main>

    <footer>
        <p>Data afkomstig van <a href="https://opendata.brussels.be" target="_blank" rel="noopener noreferrer">OpenData Brussels</a></p>
        <p>© 2024 BrusselsExplorer | Ontdek de mooiste plekken van Brussel</p>
    </footer>

    <!-- JavaScript module -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
