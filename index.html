<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrusselsExplorer - Stripmuren</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header>
    <h1>BrusselsExplorer</h1>
    <p>Stripmuren in Brussel - Ontdek de stripkunst in de stad</p>
</header>

<div class="container">
    <div class="knoppen">
        <button id="laadKnop">Laad locaties</button>
        <button id="favKnop">Favorieten</button>
        <button id="resetKnop">Reset filters</button>
        <button id="themaKnop">Donker thema</button>
        <button onclick="location.href='fotos.html'">Bekijk foto's</button>
    </div>

    <div class="zoek-filter">
        <input type="text" id="zoekInput" placeholder="Zoek op naam of tekenaar...">
        <select id="filterSelect">
            <option value="all">Alle gemeenten</option>
            <option value="Brussel">Brussel</option>
            <option value="Laken">Laken</option>
            <option value="Haren">Haren</option>
        </select>
        <select id="sorteerSelect">
            <option value="naam">Sorteer op naam</option>
            <option value="jaar">Sorteer op jaar</option>
        </select>
    </div>

    <div id="map"></div>

    <div class="tabel-container">
        <table>
            <thead>
                <tr><th>#</th><th>Naam</th><th>Adres</th><th>Tekenaar</th><th>Jaar</th><th>Favoriet</th></tr>
            </thead>
            <tbody id="tabelBody"></tbody>
        </table>
    </div>

    <div class="aantal" id="aantalInfo">0 locaties geladen</div>
</div>

<footer>
    <p>Data van OpenData Brussels - Parcours BD (Stripmuren)</p>
</footer>

<script src="script.js"></script>
</body>
</html>
